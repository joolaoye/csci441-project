[project]
name = "traffic-signs"
version = "0.1.0"
description = "Lightweight TensorFlow/Keras experimentation harness for GTSRB traffic sign classification (CSCI 441)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "tensorflow>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_signs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:.*__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning",
]
